replicaCount: 2
image:
  repository: registry.example.internal/sample
  tag: latest
service:
  port: 80
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 200m, memory: 128Mi }

ingress:
  enabled: false
  className: nginx
  host: sample.example.internal

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  cpu: 70

appVersion: ""
