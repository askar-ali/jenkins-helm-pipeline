apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.9.1
      command: ["curl", "--fail", "--silent", "--max-time", "5", "http://{{ .Release.Name }}:{{ .Values.service.port }}/healthz"]
